name: Update livestream

on:
  schedule:
    # Saturday 6 PM ET (22:00 UTC): this Sunday's stream is usually scheduled by now.
    - cron: "0 22 * * 6"
    # Sunday 8:00–11:30 AM ET, every 30 minutes, until the stream is live.
    - cron: "0,30 12-15 * * 0"
    # Sunday evening and Monday: pick up the finished stream as "last Sunday".
    - cron: "0 22 * * 0"
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_livestream.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Commit if changed
        run: |
          if ! git diff --quiet src/data/livestream.json; then
            git config user.name "livestream-bot"
            git config user.email "livestream-bot@users.noreply.github.com"
            git add src/data/livestream.json
            git commit -m "Update livestream links"
            git push
          fi
