name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Redeploy after the sermon bot commits (bot pushes don't trigger push events).
  workflow_run:
    workflows: ["Update sermons", "Update livestream"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: BASE_PATH=/${{ github.event.repository.name }} python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
