name: Update sermons

on:
  schedule:
    # Mondays and Thursdays, 14:00 UTC: picks up newly published podcast episodes.
    - cron: "0 14 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_sermons.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet src/data/sermons.json; then
            git config user.name "sermon-bot"
            git config user.email "sermon-bot@users.noreply.github.com"
            git add src/data/sermons.json
            git commit -m "Update latest sermons"
            git push
          fi
