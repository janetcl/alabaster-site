<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="/images/home/new_york_background.webp">
<link rel="icon" type="image/png" href="/images/logo-rings.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Anton&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
<script src="/js/site.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position: absolute;" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="rg1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#BFE2F6"/><stop offset="0.5" stop-color="#7CC2EA"/><stop offset="1" stop-color="#E6F4FB"/></linearGradient>
<linearGradient id="rg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E7DB8"/><stop offset="0.6" stop-color="#5BB3E0"/><stop offset="1" stop-color="#1584BF"/></linearGradient>
<linearGradient id="rg3" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#003B6F"/><stop offset="0.55" stop-color="#2D6E9E"/><stop offset="1" stop-color="#A9C7DF"/></linearGradient>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<symbol id="alab-rings" viewBox="0 0 100 100">
<circle cx="46" cy="50" r="34" fill="none" stroke="url(#rg1)" style="stroke-width: var(--rw, 4.2)"/>
<circle cx="53" cy="46" r="34" fill="none" stroke="url(#rg2)" style="stroke-width: var(--rw, 4.2)"/>
<circle cx="52" cy="54" r="34" fill="none" stroke="url(#rg3)" style="stroke-width: var(--rw, 4.2)"/>
</symbol>
</svg>
{{> announce}}
<div class="page">
{{> header}}
<main id="main">
{{content}}
</main>
</div>
{{> footer}}
</body>
</html>
